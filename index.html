    <!-- Assignment #4 — Variable Names: Legal & Illegal -->
      <script>
        // Question 1: Declare 3 variables in one statement
        var firstName = "Maaz", lastName = "khan", age = 20;

        // Question 2: Five legal variable names
        var myName = "maaz ";
        var _city = "Karachi";
        var $price = 500;
        var user1 = "Student";
        var first_name = "Yasir";

        // Five illegal variable names (written as strings)
        var illegalNames = [
            "1name",
            "my-name",
            "my name",
            "var",
            "first name"
        ];

        // Question 3: Display rules in browser
        document.write("<h1>Rules for naming JS variables</h1>");

        document.write(
            "Variable names can only contain letters, numbers, dollar signs and underscores. " +
            "For example $my_1stVariable."
        );

        document.write(
            "<br><br>Variables must begin with a letter, dollar sign or underscore. " +
            "For example $name, _name or name."
        );

        document.write(
            "<br><br>Variable names are case sensitive."
        );

        document.write(
            "<br><br>Variable names should not be JS reserved keywords."
        );

    </script>
